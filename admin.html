<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — So'rovnoma natijalari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); }
        select, input { color-scheme: dark; }
    </style>
</head>
<body class="antialiased min-h-screen">

    <!-- ===== Kirish ===== -->
    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-8 w-full max-w-sm shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-2xl mb-4">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">Admin kirish</h1>
                <p class="text-slate-400 text-sm mt-1">So'rovnoma natijalarini ko'rish uchun</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">Login</label>
                    <input id="login" type="text" required autocomplete="username" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">Parol</label>
                    <input id="password" type="password" required autocomplete="current-password" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <p id="login-error" class="hidden text-sm text-red-400"></p>
                <button id="login-btn" type="submit" class="w-full py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 shadow-lg shadow-blue-600/30">Kirish</button>
            </form>
        </div>
    </div>

    <!-- ===== Natijalar ===== -->
    <div id="dash-view" class="hidden max-w-7xl mx-auto px-4 sm:px-6 py-10 space-y-8">

        <!-- Sarlavha + tugmalar -->
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-white">So'rovnoma natijalari</h1>
                <p class="text-slate-400 text-sm mt-1">Ma'lumotlar Google Jadvaldan olinadi. <span id="updated-at"></span></p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <select id="course-filter" class="px-3 py-2 rounded-xl text-sm bg-slate-800 text-slate-200 border border-slate-700 focus:outline-none"></select>
                <button id="refresh-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-200 hover:bg-slate-700"><i class="fa-solid fa-rotate mr-1"></i> Yangilash</button>
                <button id="excel-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-600 text-white hover:bg-emerald-500"><i class="fa-solid fa-file-excel mr-1"></i> Excel yuklab olish</button>
                <button id="logout-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700"><i class="fa-solid fa-right-from-bracket mr-1"></i> Chiqish</button>
            </div>
        </div>

        <!-- KPI -->
        <div id="kpis" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4"></div>

        <!-- Kunlik dinamika -->
        <div class="glass-card p-5 rounded-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-white text-sm"><i class="fa-solid fa-chart-column mr-2 text-blue-400"></i>Kunlik javoblar (oxirgi 14 kun)</h2>
            </div>
            <div id="timeline" class="flex items-end gap-1.5 h-40"></div>
        </div>

        <!-- Har bir savol bo'yicha statistika -->
        <div>
            <h2 class="font-bold text-white mb-3">Savollar bo'yicha statistika</h2>
            <div id="charts" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <!-- Kurslar kesimida -->
        <div class="glass-card p-5 rounded-2xl space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <h2 class="font-bold text-white text-sm"><i class="fa-solid fa-table-cells mr-2 text-indigo-400"></i>Kurslar kesimida</h2>
                <select id="cross-select" class="px-3 py-2 rounded-xl text-sm bg-slate-800 text-slate-200 border border-slate-700 focus:outline-none"></select>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left whitespace-nowrap">
                    <thead id="cross-head" class="text-slate-400"></thead>
                    <tbody id="cross-body" class="divide-y divide-slate-800 text-slate-300"></tbody>
                </table>
            </div>
            <p class="text-xs text-slate-500">Katakda: soni va shu kurs ichidagi ulushi (%).</p>
        </div>

        <!-- Fikrlar -->
        <div class="glass-card p-5 rounded-2xl space-y-4">
            <h2 class="font-bold text-white text-sm"><i class="fa-solid fa-comments mr-2 text-emerald-400"></i>Talabalar fikrlari (<span id="op-count">0</span>)</h2>
            <div id="opinions" class="space-y-3 max-h-[420px] overflow-y-auto pr-1"></div>
        </div>

        <!-- Jadval -->
        <div class="space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <h2 class="font-bold text-white">Barcha javoblar</h2>
                <input id="table-search" type="search" placeholder="Qidirish..." class="px-4 py-2 rounded-xl text-sm bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-blue-500 w-full sm:w-64">
            </div>
            <div class="overflow-x-auto rounded-2xl border border-slate-800">
                <table class="w-full text-sm text-left whitespace-nowrap">
                    <thead id="table-head" class="bg-slate-950 text-slate-400"></thead>
                    <tbody id="table-body" class="divide-y divide-slate-800 text-slate-300"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Google Apps Script manzili (index.html dagi bilan bir xil)
        const API_URL = 'https://script.google.com/macros/s/AKfycbzYgQPdKDSX0CxGFZQKNH-3NbW4x3uYVXD3yDYfcJHhvm8VUaIc-y8zh3PeQT87bNQ3/exec';

        // index.html dagi SURVEY_QUESTIONS bilan bir xil bo'lishi SHART (variantlar matni ham)
        const QUESTIONS = [
            { key: 'course', label: 'Kurs', text: "1. Siz qaysi kursda o'qiysiz?", type: 'radio',
              options: ['1-kurs', '2-kurs', '3-kurs', '4-kurs / Magistratura'] },
            { key: 'topics', label: 'Mavzular', text: "2. Jurnalda qaysi mavzularni o'qishni ko'proq xohlar edingiz?", type: 'checkbox',
              options: ["Ta'lim va chet tillar", 'Karyera va frilans', "IT va sun'iy intellekt", 'Psixologiya va vaqtni boshqarish', 'Moliya va stipendiya', "Sog'liq va sport"] },
            { key: 'format', label: 'Qulay format', text: "3. Jurnalni qaysi formatda o'qish sizga qulayroq?", type: 'radio',
              options: ['Telegram kanal / Veb-sayt', 'PDF shaklida', "Bosma (qog'oz)"] },
            { key: 'frequency', label: 'Chiqish davri', text: "4. Jurnal qanchalik tez-tez chiqishi sizga ma'qul?", type: 'radio',
              options: ['Haftada bir marta', 'Oyda bir marta', 'Chorakda bir marta'] },
            { key: 'rubrics', label: 'Rubrikalar', text: "5. Jurnalga qanday rubrikalar qo'shilsin?", type: 'checkbox',
              options: ['Intervyu', 'Muvaffaqiyat hikoyalari', 'Kitob sharhlari', 'Universitet yangiliklari', "Talabalar ijodi (she'r, rasm)"] },
            { key: 'write', label: 'Maqola yozish', text: '6. Jurnal uchun maqola yozishni xohlaysizmi?', type: 'radio',
              options: ['Ha, albatta', 'Ehtimol', "Yo'q"] },
            { key: 'criteria', label: 'Muhim mezon', text: '7. Jurnal uchun eng muhim mezon qaysi?', type: 'radio',
              options: ['Dolzarblik', 'Amaliy foyda', 'Qulay dizayn', 'Qisqa va tushunarli matn'] },
            { key: 'ads', label: 'Reklama', text: "8. Jurnalda talabalarga mos reklama bo'lishiga rozimisiz?", type: 'radio',
              options: ['Ha', "Faqat sifatli va mos bo'lsa", "Yo'q"] },
            { key: 'language', label: 'Til', text: "9. Qaysi tillarda maqolalar o'qishni xohlaysiz?", type: 'checkbox',
              options: ["O'zbek", 'Rus', 'Ingliz'] },
            { key: 'opinion', label: 'Fikr', text: "10. Sizningcha, talabalar uchun yaxshi jurnal qanday bo'lishi kerak?", type: 'text' }
        ];
        const CHOICE_Q = QUESTIONS.filter(q => q.type !== 'text');
        const Q_BY_KEY = Object.fromEntries(QUESTIONS.map(q => [q.key, q]));

        let records = [];      // barcha javoblar (yangisi birinchi)
        let credentials = null;

        // ---------- Yordamchi funksiyalar ----------
        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        const pad = n => String(n).padStart(2, '0');
        const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const pct = (c, base) => base ? Math.round((c / base) * 1000) / 10 : 0;

        // "2026-11-10 20:05:00" (yangi format) yoki "10/11/2026, 20:05:00" / "10.11.2026 20:05" (eski format)
        function parseDate(s) {
            s = String(s || '').trim();
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
            if (m) return new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
            m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
            if (m) return new Date(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
            return null;
        }

        // ---------- API ----------
        async function api(body) {
            // text/plain — CORS preflight bo'lmasligi uchun; parol URL'da emas, so'rov tanasida ketadi
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || 'error');
            return data;
        }

        async function loadData() {
            const data = await api({ action: 'results', login: credentials.login, password: credentials.password });
            const rows = data.rows || [];
            const header = (rows[0] || []).map(h => String(h).trim());
            const idx = {};
            header.forEach((h, i) => idx[h] = i);
            const dateCol = idx['Sana'] ?? 0;

            records = rows.slice(1)
                .filter(r => r.some(c => String(c).trim() !== ''))
                .map(r => {
                    const rec = { date: String(r[dateCol] ?? ''), values: {} };
                    rec.dateObj = parseDate(rec.date);
                    QUESTIONS.forEach(q => {
                        const cell = idx[q.key] !== undefined ? String(r[idx[q.key]] ?? '').trim() : '';
                        rec.values[q.key] = q.type === 'checkbox'
                            ? cell.split(';').map(s => s.trim()).filter(Boolean)
                            : cell;
                    });
                    return rec;
                })
                .reverse(); // eng yangisi birinchi

            document.getElementById('updated-at').textContent =
                'Yangilangan: ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            render();
        }

        // ---------- Statistika hisoblash ----------
        function filtered() {
            const c = document.getElementById('course-filter').value;
            return c ? records.filter(r => r.values.course === c) : records;
        }

        function questionStats(q, list) {
            const answered = list.filter(r => q.type === 'checkbox' ? r.values[q.key].length : r.values[q.key]);
            const counts = new Map(q.options.map(o => [o, 0]));
            answered.forEach(r => {
                const vals = q.type === 'checkbox' ? r.values[q.key] : [r.values[q.key]];
                vals.forEach(v => counts.set(v, (counts.get(v) || 0) + 1)); // kutilmagan variant ham hisoblanadi
            });
            const items = [...counts.entries()]
                .map(([option, count]) => ({ option, count, pct: pct(count, answered.length) }))
                .sort((a, b) => b.count - a.count);
            return { answered: answered.length, items };
        }

        // ---------- Chizish ----------
        function render() {
            const list = filtered();
            renderKpis(list);
            renderTimeline(list);
            renderCharts(list);
            renderCross();
            renderOpinions(list);
            renderTable();
        }

        function kpi(value, label, color) {
            return `<div class="glass-card p-5 rounded-2xl">
                <div class="text-2xl font-extrabold ${color} truncate">${esc(value)}</div>
                <p class="text-xs text-slate-400 mt-1">${esc(label)}</p></div>`;
        }

        function renderKpis(list) {
            const today = dayKey(new Date());
            const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6); weekAgo.setHours(0, 0, 0, 0);
            const todayCount = list.filter(r => r.dateObj && dayKey(r.dateObj) === today).length;
            const weekCount = list.filter(r => r.dateObj && r.dateObj >= weekAgo).length;
            const writeYes = list.filter(r => r.values.write === 'Ha, albatta').length;
            const writeAns = list.filter(r => r.values.write).length;
            const opinions = list.filter(r => r.values.opinion).length;
            document.getElementById('kpis').innerHTML =
                kpi(list.length, 'Jami javoblar', 'text-blue-400') +
                kpi(todayCount, 'Bugun', 'text-emerald-400') +
                kpi(weekCount, 'Oxirgi 7 kun', 'text-cyan-400') +
                kpi(writeYes + ` (${pct(writeYes, writeAns)}%)`, 'Maqola yozishga tayyor', 'text-amber-400') +
                kpi(opinions, 'Fikr qoldirganlar', 'text-purple-400') +
                kpi(list[0]?.date || '—', 'Oxirgi javob', 'text-indigo-400 text-base');
        }

        function renderTimeline(list) {
            const days = [];
            for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
            const counts = {};
            list.forEach(r => { if (r.dateObj) { const k = dayKey(r.dateObj); counts[k] = (counts[k] || 0) + 1; } });
            const max = Math.max(1, ...days.map(d => counts[dayKey(d)] || 0));
            document.getElementById('timeline').innerHTML = days.map(d => {
                const c = counts[dayKey(d)] || 0;
                const h = Math.max(c ? 6 : 2, Math.round((c / max) * 100));
                return `<div class="flex-1 h-full flex flex-col items-center justify-end gap-1" title="${dayKey(d)}: ${c} ta">
                    <span class="text-[10px] text-slate-400">${c || ''}</span>
                    <div class="w-full rounded-t-md ${c ? 'bg-gradient-to-t from-blue-600 to-indigo-500' : 'bg-slate-800'}" style="height:${h}%"></div>
                    <span class="text-[10px] text-slate-500">${pad(d.getDate())}.${pad(d.getMonth() + 1)}</span>
                </div>`;
            }).join('');
        }

        function renderCharts(list) {
            document.getElementById('charts').innerHTML = CHOICE_Q.map(q => {
                const s = questionStats(q, list);
                const top = s.items[0]?.count || 0;
                const bars = s.items.map(it => `<div>
                    <div class="flex justify-between text-sm mb-1 gap-3">
                        <span class="${it.count && it.count === top ? 'text-white font-semibold' : 'text-slate-300'}">${esc(it.option)}</span>
                        <span class="text-slate-400 whitespace-nowrap">${it.count} ta (${it.pct}%)</span>
                    </div>
                    <div class="h-2.5 rounded-full bg-slate-800 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-blue-600 to-indigo-500" style="width:${it.pct}%"></div></div>
                </div>`).join('');
                return `<div class="glass-card p-5 rounded-2xl space-y-4">
                    <div>
                        <h3 class="font-bold text-white text-sm">${esc(q.text)}</h3>
                        <p class="text-xs text-slate-500 mt-1">Javob berganlar: ${s.answered} ta${q.type === 'checkbox' ? ' · bir nechta tanlash mumkin, % — javob berganlarga nisbatan' : ''}</p>
                    </div>
                    <div class="space-y-3">${bars}</div>
                </div>`;
            }).join('');
        }

        function crossData(q) {
            const courses = Q_BY_KEY.course.options;
            const byCourse = courses.map(c => records.filter(r => r.values.course === c));
            const rows = questionStats(q, records).items.map(it => it.option);
            return { courses, byCourse, rows };
        }

        function renderCross() {
            const key = document.getElementById('cross-select').value;
            const q = Q_BY_KEY[key];
            if (!q) return;
            const { courses, byCourse, rows } = crossData(q);
            const statsPerCourse = byCourse.map(list => {
                const s = questionStats(q, list);
                return { answered: s.answered, map: Object.fromEntries(s.items.map(it => [it.option, it])) };
            });
            document.getElementById('cross-head').innerHTML = '<tr><th class="px-3 py-2 font-semibold">Variant</th>' +
                courses.map((c, i) => `<th class="px-3 py-2 font-semibold">${esc(c)} <span class="text-slate-500 font-normal">(${statsPerCourse[i].answered})</span></th>`).join('') + '</tr>';
            document.getElementById('cross-body').innerHTML = rows.map(opt => '<tr>' +
                `<td class="px-3 py-2 text-slate-200">${esc(opt)}</td>` +
                statsPerCourse.map(s => {
                    const it = s.map[opt] || { count: 0, pct: 0 };
                    return `<td class="px-3 py-2">${it.count} <span class="text-slate-500">(${it.pct}%)</span></td>`;
                }).join('') + '</tr>').join('');
        }

        function renderOpinions(list) {
            const ops = list.filter(r => r.values.opinion);
            document.getElementById('op-count').textContent = ops.length;
            document.getElementById('opinions').innerHTML = ops.length ? ops.map(r => `
                <div class="rounded-xl bg-slate-900/70 border border-slate-800 p-4">
                    <p class="text-slate-200 text-sm whitespace-pre-wrap">${esc(r.values.opinion)}</p>
                    <p class="text-xs text-slate-500 mt-2">${esc(r.values.course || '—')} · ${esc(r.date)}</p>
                </div>`).join('') : '<p class="text-sm text-slate-500">Hozircha fikrlar yo\'q</p>';
        }

        function renderTable() {
            const q = document.getElementById('table-search').value.trim().toLowerCase();
            let list = filtered();
            if (q) list = list.filter(r => (r.date + ' ' + QUESTIONS.map(x => [].concat(r.values[x.key]).join(' ')).join(' ')).toLowerCase().includes(q));
            document.getElementById('table-head').innerHTML = '<tr><th class="px-4 py-3 font-semibold">#</th><th class="px-4 py-3 font-semibold">Sana</th>' +
                QUESTIONS.map(x => `<th class="px-4 py-3 font-semibold">${esc(x.label)}</th>`).join('') + '</tr>';
            document.getElementById('table-body').innerHTML = list.length ? list.map((r, i) => '<tr>' +
                `<td class="px-4 py-3 text-slate-500">${list.length - i}</td><td class="px-4 py-3">${esc(r.date)}</td>` +
                QUESTIONS.map(x => {
                    const v = [].concat(r.values[x.key]).join('; ');
                    return `<td class="px-4 py-3 ${v.length > 60 ? 'whitespace-normal min-w-[260px]' : ''}">${esc(v || '—')}</td>`;
                }).join('') + '</tr>').join('')
                : `<tr><td colspan="${QUESTIONS.length + 2}" class="px-4 py-6 text-center text-slate-500">Javoblar topilmadi</td></tr>`;
        }

        // ---------- Excel eksport ----------
        function sheetFromAoa(aoa, widths) {
            const ws = XLSX.utils.aoa_to_sheet(aoa);
            ws['!cols'] = widths.map(w => ({ wch: w }));
            return ws;
        }

        function exportExcel() {
            if (typeof XLSX === 'undefined') { alert("Excel kutubxonasi yuklanmadi. Internetni tekshirib, sahifani yangilang."); return; }
            const list = filtered();
            const courseSel = document.getElementById('course-filter').value;
            const wb = XLSX.utils.book_new();

            // 1) Barcha javoblar
            const answers = [['№', 'Sana', ...QUESTIONS.map(q => q.label)]];
            [...list].reverse().forEach((r, i) => answers.push([i + 1, r.date, ...QUESTIONS.map(q => [].concat(r.values[q.key]).join('; '))]));
            const wsA = sheetFromAoa(answers, [5, 20, 16, 40, 24, 20, 40, 18, 24, 26, 20, 60]);
            wsA['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: answers.length - 1, c: answers[0].length - 1 } }) };
            XLSX.utils.book_append_sheet(wb, wsA, 'Javoblar');

            // 2) Statistika
            const st = [
                ["So'rovnoma statistikasi" + (courseSel ? ` — ${courseSel}` : '')],
                ['Jami javoblar', list.length],
                ['Yuklab olingan', new Date().toLocaleString('ru-RU')],
                [],
                ['Savol', 'Variant', 'Soni', 'Foiz (%)', 'Javob berganlar']
            ];
            CHOICE_Q.forEach(q => {
                const s = questionStats(q, list);
                s.items.forEach((it, i) => st.push([i === 0 ? q.text : '', it.option, it.count, it.pct, i === 0 ? s.answered : '']));
                st.push([]);
            });
            XLSX.utils.book_append_sheet(wb, sheetFromAoa(st, [55, 34, 8, 10, 16]), 'Statistika');

            // 3) Kurslar kesimida (barcha savollar)
            const cr = [];
            CHOICE_Q.filter(q => q.key !== 'course').forEach(q => {
                const { courses, byCourse, rows } = crossData(q);
                const per = byCourse.map(l => Object.fromEntries(questionStats(q, l).items.map(it => [it.option, it])));
                cr.push([q.text]);
                cr.push(['Variant', ...courses.flatMap(c => [c + ' (soni)', c + ' (%)'])]);
                rows.forEach(opt => cr.push([opt, ...per.flatMap(m => [m[opt]?.count || 0, m[opt]?.pct || 0])]));
                cr.push([]);
            });
            XLSX.utils.book_append_sheet(wb, sheetFromAoa(cr, [36, 12, 9, 12, 9, 12, 9, 22, 9]), 'Kurslar kesimida');

            // 4) Fikrlar
            const op = [['Sana', 'Kurs', 'Fikr']];
            list.filter(r => r.values.opinion).forEach(r => op.push([r.date, r.values.course, r.values.opinion]));
            XLSX.utils.book_append_sheet(wb, sheetFromAoa(op, [20, 20, 100]), 'Fikrlar');

            XLSX.writeFile(wb, `sorovnoma_natijalari_${dayKey(new Date())}.xlsx`);
        }

        // ---------- Hodisalar ----------
        function initSelects() {
            document.getElementById('course-filter').innerHTML = '<option value="">Barcha kurslar</option>' +
                Q_BY_KEY.course.options.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
            document.getElementById('cross-select').innerHTML =
                CHOICE_Q.filter(q => q.key !== 'course').map(q => `<option value="${q.key}">${esc(q.label)}</option>`).join('');
        }
        initSelects();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            err.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Tekshirilmoqda...';
            try {
                credentials = { login: document.getElementById('login').value.trim(), password: document.getElementById('password').value };
                await loadData();
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dash-view').classList.remove('hidden');
            } catch (ex) {
                credentials = null;
                err.textContent = ex.message === 'unauthorized' ? "Login yoki parol noto'g'ri." : "Ulanishda xatolik: " + ex.message;
                err.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Kirish';
            }
        });

        document.getElementById('refresh-btn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            btn.disabled = true;
            try { await loadData(); } catch (ex) { alert('Yangilashda xatolik: ' + ex.message); }
            finally { btn.disabled = false; }
        });
        document.getElementById('course-filter').addEventListener('change', render);
        document.getElementById('cross-select').addEventListener('change', renderCross);
        document.getElementById('table-search').addEventListener('input', renderTable);
        document.getElementById('excel-btn').addEventListener('click', exportExcel);

        document.getElementById('logout-btn').addEventListener('click', () => {
            credentials = null;
            records = [];
            document.getElementById('login-form').reset();
            document.getElementById('dash-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        });
    </script>
</body>
</html>
