            { key: 'ads', type: 'radio', text: "8. Jurnalda talabalarga mos reklama bo'lishiga rozimisiz?",
              options: ['Ha', "Faqat sifatli va mos bo'lsa", "Yo'q"] },
            { key: 'language', type: 'checkbox', text: "9. Qaysi tillarda maqolalar o'qishni xohlaysiz?", hint: '(Bir nechta tanlash mumkin)',
              options: ["O'zbek", 'Rus', 'Ingliz'] },
            { key: 'opinion', type: 'text', text: "10. Sizningcha, talabalar uchun yaxshi jurnal qanday bo'lishi kerak?" }
        ];

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 4000);
        }


        // ===================== ADMIN PANEL =====================
        // Parol HTML ichida saqlanmaydi — u Google Apps Script tomonida tekshiriladi.
        const ADMIN_SESSION_KEY = 'ivf_admin_key';
        let adminAllRows = [];
        let adminKey = '';

        function adminSession(action, value) {
            try {
                if (action === 'get') return sessionStorage.getItem(ADMIN_SESSION_KEY) || '';
                if (action === 'set') sessionStorage.setItem(ADMIN_SESSION_KEY, value);
                if (action === 'clear') sessionStorage.removeItem(ADMIN_SESSION_KEY);
            } catch (e) { /* sessionStorage mavjud emas */ }
            return '';
        }

        function initAdmin() {
            const saved = adminSession('get');
            if (saved) {
                adminKey = saved;
                adminShowDashboard();
                adminRefresh();
            } else {
                adminShowLogin();
            }
        }

        function adminShowLogin(errorText) {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-login').classList.remove('hidden');
            const err = document.getElementById('admin-login-error');
            if (errorText) { err.textContent = errorText; err.classList.remove('hidden'); }
            else err.classList.add('hidden');
            setTimeout(() => document.getElementById('admin-password').focus(), 50);
        }

        function adminShowDashboard() {
            document.getElementById('admin-login').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
        }

        // JSONP orqali so'rov — brauzerda bir nechta Google akkaunt ochiq bo'lsa ham ishlaydi (CORS muammosisiz)
        function adminFetch(key) {
            return new Promise((resolve, reject) => {
                const cb = '__ivfAdminCb' + Date.now() + Math.floor(Math.random() * 1000);
                const script = document.createElement('script');
                const cleanup = () => { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } script.remove(); };
                const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 20000);
                window[cb] = data => { cleanup(); resolve(data); };
                script.onerror = () => { cleanup(); reject(new Error('load error')); };
                script.src = SURVEY_ENDPOINT + '?action=results&key=' + encodeURIComponent(key) + '&callback=' + cb + '&t=' + Date.now();
                document.head.appendChild(script);
            });
        }

        async function adminLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('admin-login-btn');
            const key = document.getElementById('admin-password').value;
            btn.disabled = true;
            try {
                const data = await adminFetch(key);
                if (!data || data.ok !== true) {
                    adminShowLogin("Parol noto'g'ri.");
                    return;
                }
                adminKey = key;
                adminSession('set', key);
                document.getElementById('admin-password').value = '';
                adminAllRows = Array.isArray(data.rows) ? data.rows : [];
                adminShowDashboard();
                adminInitFilter();
                adminRender();
            } catch (err) {
                adminShowLogin("Server bilan bog'lanib bo'lmadi. Apps Script yangilanganini tekshiring.");
            } finally {
                btn.disabled = false;
            }
        }

        function adminLogout() {
            adminSession('clear');
            adminKey = '';
            adminAllRows = [];
            adminShowLogin();
        }

        async function adminRefresh() {
            const btn = document.getElementById('admin-refresh-btn');
            const icon = btn.querySelector('i');
            btn.disabled = true; icon.classList.add('fa-spin');
            try {
                const data = await adminFetch(adminKey);
                if (!data || data.ok !== true) {
                    adminSession('clear');
                    adminShowLogin("Sessiya tugagan yoki parol o'zgargan. Qayta kiring.");
                    return;
                }
                adminAllRows = Array.isArray(data.rows) ? data.rows : [];
                adminInitFilter();
                adminRender();
            } catch (err) {
                showToast("Ma'lumotlarni yuklab bo'lmadi.");
            } finally {
                btn.disabled = false; icon.classList.remove('fa-spin');
            }
        }

        function adminInitFilter() {
            const sel = document.getElementById('admin-filter-course');
            const current = sel.value;
            const courseQ = SURVEY_QUESTIONS.find(q => q.key === 'course');
            const opts = ['__all__'].concat(courseQ ? courseQ.options : []);
            sel.innerHTML = opts.map(o => `<option value="${escapeHtml(o)}">${o === '__all__' ? 'Barcha kurslar' : escapeHtml(o)}</option>`).join('');
            if (opts.includes(current)) sel.value = current;
        }

        function adminFilteredRows() {
            const course = document.getElementById('admin-filter-course').value;
            if (!course || course === '__all__') return adminAllRows;
            return adminAllRows.filter(r => String((r.answers || {}).course || '').trim() === course);
        }

        function adminValue(row, key) {
            const v = (row.answers || {})[key];
            if (Array.isArray(v)) return v.join(', ');
            return String(v ?? '').trim();
        }

        // Bitta savol bo'yicha statistika
        function adminQuestionStats(q, rows) {
            const counts = q.options ? q.options.map(() => 0) : [];
            let answered = 0, other = 0;
            rows.forEach(row => {
                const val = adminValue(row, q.key);
                if (!val) return;
                answered++;
                if (q.type === 'radio') {
                    const idx = q.options.indexOf(val);
                    if (idx >= 0) counts[idx]++; else other++;
                } else if (q.type === 'checkbox') {
                    // Variantlar ichida vergul bo'lishi mumkin, shuning uchun matn bo'yicha qidiriladi
                    let matched = false;
                    q.options.forEach((opt, i) => { if (val.includes(opt)) { counts[i]++; matched = true; } });
                    if (!matched) other++;
                }
            });
            return { counts, answered, other };
        }

        function adminBar(label, count, base, isTop, colorClass) {
            const pct = base ? Math.round(count / base * 1000) / 10 : 0;
            return `
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between gap-3 text-sm">
                        <span class="${isTop ? 'text-white font-semibold' : 'text-slate-300'}">${isTop ? '<i class="fa-solid fa-crown text-amber-400 mr-1.5 text-xs"></i>' : ''}${escapeHtml(label)}</span>
                        <span class="shrink-0 text-slate-400 tabular-nums"><b class="text-white">${count}</b> · ${pct}%</span>
                    </div>
                    <div class="h-2.5 rounded-full bg-slate-800 overflow-hidden">
                        <div class="h-full rounded-full ${colorClass}" style="width:${Math.min(pct, 100)}%"></div>
                    </div>
                </div>`;
        }

        function adminRender() {
            const rows = adminFilteredRows();
            const total = rows.length;
            const last = adminAllRows.length ? adminAllRows[adminAllRows.length - 1] : null;
            const opinions = rows.filter(r => adminValue(r, 'opinion')).length;

            document.getElementById('admin-updated').textContent =
                'Yangilandi: ' + new Date().toLocaleString('uz-UZ') + ' · Jami bazada: ' + adminAllRows.length + ' ta javob';

            const card = (icon, color, title, value) => `
                <div class="glass-card rounded-2xl p-5 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl ${color} flex items-center justify-center text-lg"><i class="fa-solid ${icon}"></i></div>
                    <div class="min-w-0"><p class="text-xs text-slate-400">${title}</p><p class="text-xl font-extrabold text-white truncate">${value}</p></div>
                </div>`;
            document.getElementById('admin-summary').innerHTML =
                card('fa-users', 'bg-blue-500/15 text-blue-400', 'Javoblar soni (filtr bo\'yicha)', total) +
                card('fa-clock', 'bg-emerald-500/15 text-emerald-400', 'Oxirgi javob', last ? escapeHtml(last.date || '—') : '—') +
                card('fa-comment-dots', 'bg-purple-500/15 text-purple-400', 'Fikr yozganlar', opinions);

            const statsEl = document.getElementById('admin-stats');
            if (!total) {
                statsEl.innerHTML = `<div class="lg:col-span-2 glass-card rounded-2xl p-10 text-center text-slate-400">
                    <i class="fa-regular fa-folder-open text-3xl mb-3 block"></i>Hozircha javoblar yo'q.</div>`;
                return;
            }

            statsEl.innerHTML = SURVEY_QUESTIONS.map(q => {
                if (q.type === 'text') {
                    const list = rows.map(r => ({ date: r.date, text: adminValue(r, q.key) })).filter(x => x.text).reverse();
                    const items = list.length
                        ? list.map(x => `<li class="p-3 rounded-xl bg-darkblue-900 border border-slate-800">
                                <p class="text-sm text-slate-200 whitespace-pre-line break-words">${escapeHtml(x.text)}</p>
                                <p class="text-xs text-slate-500 mt-1">${escapeHtml(x.date || '')}</p></li>`).join('')
                        : '<li class="text-sm text-slate-500">Hech kim fikr yozmagan.</li>';
                    return `<div class="glass-card rounded-2xl p-6 lg:col-span-2 space-y-4">
                        <div class="flex items-start justify-between gap-3">
                            <h3 class="font-bold text-white">${escapeHtml(q.text)}</h3>
                            <span class="shrink-0 text-xs text-slate-400">${list.length} / ${total} javob</span>
                        </div>
                        <ul class="space-y-2 max-h-96 overflow-y-auto pr-1">${items}</ul>
                    </div>`;
                }

                const s = adminQuestionStats(q, rows);
                const max = Math.max(0, ...s.counts);
                const color = q.type === 'checkbox' ? 'bg-gradient-to-r from-indigo-500 to-purple-500' : 'bg-gradient-to-r from-blue-500 to-cyan-400';
                const bars = q.options.map((opt, i) => adminBar(opt, s.counts[i], s.answered, max > 0 && s.counts[i] === max, color)).join('')
                    + (s.other ? adminBar('Boshqa / tanilmagan', s.other, s.answered, false, 'bg-slate-500') : '');
                const note = q.type === 'checkbox'
                    ? '<p class="text-xs text-slate-500">Bir nechta tanlash mumkin — foizlar yig\'indisi 100% dan oshishi mumkin.</p>' : '';
                return `<div class="glass-card rounded-2xl p-6 space-y-4">
                    <div class="flex items-start justify-between gap-3">
                        <h3 class="font-bold text-white">${escapeHtml(q.text)}</h3>
                        <span class="shrink-0 text-xs text-slate-400">${s.answered} / ${total} javob</span>
                    </div>
                    <div class="space-y-3">${bars}</div>
                    ${note}
                </div>`;
            }).join('');
        }

        function adminExportCsv() {
            const rows = adminFilteredRows();
            const esc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
            const header = ['Sana'].concat(SURVEY_QUESTIONS.map(q => q.text));
            const lines = [header.map(esc).join(',')].concat(
                rows.map(r => [r.date || ''].concat(SURVEY_QUESTIONS.map(q => adminValue(r, q.key))).map(esc).join(','))
            );
            const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'sorovnoma-natijalari-' + new Date().toISOString().slice(0, 10) + '.csv';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        initAdmin();
    </script>
</body>
</html>
